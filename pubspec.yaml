name: fitai_coach
description: AI-powered fitness coach mobile app with personalized workout plans, calorie tracking, and 24/7 AI coaching.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.4.1
  firebase_messaging: ^15.2.1
  google_sign_in: ^6.2.2

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # UI & Charts
  fl_chart: ^0.70.2
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1

  # Camera & Image
  image_picker: ^1.1.2
  camera: ^0.11.0+2

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  connectivity_plus: ^6.1.1
  path_provider: ^2.1.5
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  http: ^1.3.0
  dart_jsonwebtoken: ^2.14.4

  # Animations
  animations: ^2.0.11
  percent_indicator: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
